services:
  app:
    build:
      context: .
      dockerfile: src/PRN222.RagAssistant/Dockerfile
    container_name: prn222-app
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-prn222_rag};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Database__ApplyMigrationsOnStartup: ${DATABASE_APPLY_MIGRATIONS_ON_STARTUP:-true}
      Auth__SeedUsers__Enabled: ${AUTH_SEED_USERS:-false}
      Auth__SeedUsers__Admin__Email: ${AUTH_ADMIN_EMAIL:-}
      Auth__SeedUsers__Admin__Password: ${AUTH_ADMIN_PASSWORD:-}
      Auth__SeedUsers__Admin__DisplayName: ${AUTH_ADMIN_DISPLAY_NAME:-Administrator}
      Auth__SeedUsers__SubjectLeader__Email: ${AUTH_SUBJECT_LEADER_EMAIL:-}
      Auth__SeedUsers__SubjectLeader__Password: ${AUTH_SUBJECT_LEADER_PASSWORD:-}
      Auth__SeedUsers__SubjectLeader__DisplayName: ${AUTH_SUBJECT_LEADER_DISPLAY_NAME:-Subject Leader}
      Auth__SeedUsers__Student__Email: ${AUTH_STUDENT_EMAIL:-}
      Auth__SeedUsers__Student__Password: ${AUTH_STUDENT_PASSWORD:-}
      Auth__SeedUsers__Student__DisplayName: ${AUTH_STUDENT_DISPLAY_NAME:-Student}
      Rag__Provider: ${RAG_PROVIDER:-Ollama}
      Rag__ChatProvider: ${RAG_CHAT_PROVIDER:-}
      Rag__EmbeddingProvider: ${RAG_EMBEDDING_PROVIDER:-}
      Rag__EmbeddingDimensions: ${RAG_EMBEDDING_DIMENSIONS:-1024}
      Rag__Ollama__BaseUrl: http://ollama:11434
      Rag__Ollama__ChatModel: ${OLLAMA_CHAT_MODEL:-qwen3:4b}
      Rag__Ollama__EmbeddingModel: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      Rag__OpenAI__BaseUrl: ${OPENAI_BASE_URL:-https://api.openai.com/v1/}
      Rag__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      Rag__OpenAI__ChatModel: ${OPENAI_CHAT_MODEL:-gpt-5.6-luna}
      Rag__OpenAI__EmbeddingModel: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      Rag__Gemini__BaseUrl: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/}
      Rag__Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Rag__Gemini__ChatModels: "${GEMINI_CHAT_MODELS:-gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash,gemini-2.5-flash-lite}"
      Rag__Gemini__EmbeddingModel: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      Rag__OpenRouter__BaseUrl: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1/}
      Rag__OpenRouter__ApiKey: ${OPENROUTER_API_KEY:-}
      Rag__OpenRouter__ChatModels: "${OPENROUTER_CHAT_MODELS:-nvidia/nemotron-3.5-lightning:free,nvidia/nemotron-3-ultra-550b-a55b:free,nvidia/nemotron-3-super-120b-a12b:free,google/gemma-4-26b-a4b-it:free,openai/gpt-oss-20b:free,openrouter/free}"
      Rag__OpenRouter__EmbeddingModel: ${OPENROUTER_EMBEDDING_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2:free}
      Rag__OpenRouter__HttpReferer: ${OPENROUTER_HTTP_REFERER:-}
      Rag__OpenRouter__AppTitle: ${OPENROUTER_APP_TITLE:-PRN222 RAG Assistant}
      Rag__Storage__UploadsPath: /app/storage/uploads
      Billing__BaseUrl: ${BILLING_BASE_URL:-https://prn222-rag-assistant.onrender.com}
      Billing__VnPay__TmnCode: ${VNPAY_TMN_CODE:-8OTYXKKM}
      Billing__VnPay__HashSecret: ${VNPAY_HASH_SECRET:-EUKFJAYATVRRJBDQHUWZTJRCTCSSOYVY}
      Billing__VnPay__BaseUrl: ${VNPAY_BASE_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      Billing__VnPay__Version: ${VNPAY_VERSION:-2.1.0}
      Billing__VnPay__Command: ${VNPAY_COMMAND:-pay}
      Billing__VnPay__Locale: ${VNPAY_LOCALE:-vn}
      Billing__VnPay__OrderType: ${VNPAY_ORDER_TYPE:-other}
      Billing__VnPay__WebhookPath: ${VNPAY_WEBHOOK_PATH:-/Billing/Webhook}
      Billing__VnPay__Sandbox: ${VNPAY_SANDBOX:-true}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./storage/uploads:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    container_name: prn222-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prn222_rag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-prn222_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    profiles: ["local-ai"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.32.5}
    container_name: prn222-ollama
    restart: unless-stopped
    environment:
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  ollama_data:
