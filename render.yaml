# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

databases:
  - name: prn222-rag-db
    databaseName: prn222_rag
    user: prn222_rag
    plan: free
    region: singapore
    postgresMajorVersion: 17

services:
  - type: web
    name: prn222-rag-assistant
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/IKurokami/PRN222-RAG-Assistant
    branch: master
    dockerfilePath: ./src/PRN222.RagAssistant/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: ConnectionStrings__Postgres
        fromDatabase:
          name: prn222-rag-db
          property: connectionString
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      - key: Auth__SeedUsers__Enabled
        value: "false"
      - key: Rag__Storage__UploadsPath
        value: /app/storage/uploads
      - key: Rag__Provider
        value: OpenRouter
      - key: Rag__ChatProvider
        value: Gemini
      - key: Rag__EmbeddingProvider
        value: OpenRouter
      - key: Rag__EmbeddingDimensions
        value: "1024"
      - key: Rag__Gemini__BaseUrl
        value: https://generativelanguage.googleapis.com/
      - key: Rag__Gemini__ApiKey
        sync: false
      - key: Rag__Gemini__ChatModels
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash,gemini-2.5-flash-lite
      - key: Rag__OpenRouter__BaseUrl
        value: https://openrouter.ai/api/v1/
      - key: Rag__OpenRouter__ApiKey
        sync: false
      - key: Rag__OpenRouter__EmbeddingModel
        value: nvidia/llama-nemotron-embed-vl-1b-v2:free
      - key: Rag__OpenRouter__AppTitle
        value: PRN222 RAG Assistant
      - key: Billing__Enabled
        value: "true"
      - key: Billing__BaseUrl
        value: https://prn222-rag-assistant.onrender.com
      - key: Billing__VnPay__TmnCode
        value: 8OTYXKKM
      - key: Billing__VnPay__HashSecret
        sync: false
      - key: Billing__VnPay__BaseUrl
        value: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - key: Billing__VnPay__Version
        value: 2.1.0
      - key: Billing__VnPay__Command
        value: pay
      - key: Billing__VnPay__Locale
        value: vn
      - key: Billing__VnPay__OrderType
        value: other
