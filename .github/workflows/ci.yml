name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore frontend libraries
        run: dotnet libman restore

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Generate initial EF migration candidate
        run: >-
          dotnet ef migrations add InitialAuthAndCoreSchema
          --project src/PRN222.RagAssistant
          --startup-project src/PRN222.RagAssistant
          --output-dir Data/Migrations

      - name: Print generated EF migration files
        run: |
          for file in src/PRN222.RagAssistant/Data/Migrations/*; do
            echo "===FILE:${file}==="
            base64 -w 0 "${file}"
            echo
            echo "===END_FILE==="
          done

      - name: Validate Docker Compose
        run: docker compose config
