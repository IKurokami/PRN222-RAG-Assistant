name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore frontend libraries
        run: dotnet libman restore

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Generate initial EF migration
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/setup-auth-db-integration' }}
        run: >-
          dotnet ef migrations add InitialAuthAndCoreSchema
          --project src/PRN222.RagAssistant
          --startup-project src/PRN222.RagAssistant
          --output-dir Data/Migrations

      - name: Commit generated EF migration
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/setup-auth-db-integration' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PRN222.RagAssistant/Data/Migrations
          git commit -m "feat: add initial auth and core schema migration"
          git push origin HEAD:${{ github.head_ref }}

      - name: Validate Docker Compose
        run: docker compose config
