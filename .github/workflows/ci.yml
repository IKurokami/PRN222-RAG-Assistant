name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore frontend libraries
        run: dotnet libman restore

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Check EF Core model matches migrations
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/PRN222.RagAssistant
          --startup-project src/PRN222.RagAssistant

      - name: Validate Docker Compose
        run: docker compose config

      - name: Start PostgreSQL validation database
        run: |
          docker compose up -d postgres
          for attempt in {1..30}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' prn222-postgres 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Apply EF Core migrations to PostgreSQL
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=prn222_rag;Username=postgres;Password=postgres
        run: >-
          dotnet ef database update
          --project src/PRN222.RagAssistant
          --startup-project src/PRN222.RagAssistant

      - name: Verify PostgreSQL schema baseline
        run: |
          docker compose exec -T postgres psql -U postgres -d prn222_rag -v ON_ERROR_STOP=1 -c "SELECT extversion FROM pg_extension WHERE extname = 'vector';"
          docker compose exec -T postgres psql -U postgres -d prn222_rag -v ON_ERROR_STOP=1 -c "SELECT \"Code\", \"Name\" FROM \"Subjects\" WHERE \"Code\" = 'PRN222';"
          docker compose exec -T postgres psql -U postgres -d prn222_rag -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM \"__EFMigrationsHistory\";"

      - name: Verify pgvector mixed-dimension reindex compatibility
        run: >-
          docker compose exec -T postgres psql -U postgres -d prn222_rag -v ON_ERROR_STOP=1 -c
          "CREATE TEMP TABLE vector_dimension_check (embedding vector);
          INSERT INTO vector_dimension_check (embedding) VALUES ('[1,2]'::vector), ('[1,2,3]'::vector);
          SELECT vector_dims(embedding) FROM vector_dimension_check ORDER BY vector_dims(embedding);
          SELECT embedding <=> '[1,2]'::vector AS distance
          FROM vector_dimension_check
          WHERE vector_dims(embedding) = 2;"

      - name: Stop PostgreSQL validation database
        if: always()
        run: docker compose down
